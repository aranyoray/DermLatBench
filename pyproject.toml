[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dermlat-audit"
version = "0.1.0"
description = "Local, reproducible audit pipeline for the DermLatBench dermatology laterality dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dermlat-audit contributors" }]
keywords = ["dermatology", "laterality", "dataset-audit", "reproducibility"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Intended Audience :: Science/Research",
]

# Core deps (kept small; heavy backends are extras).
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.2",
    "imagehash>=4.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "jsonschema>=4.21",
    "tqdm>=4.66",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Streamlit reviewer UI
review = ["streamlit>=1.32"]

# Local VLM backends — install per user's hardware.
mlx = ["mlx>=0.11", "mlx-vlm>=0.0.10"]
ollama = ["httpx>=0.27"]

# Statistics extras
stats = ["krippendorff>=0.6.0"]

# Dev / test tooling
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4.0",
    "mypy>=1.9",
    "types-PyYAML",
    "types-jsonschema",
]

# One-shot: everything except heavy accelerated backends
all = [
    "dermlat-audit[review,ollama,stats,dev]",
]

[project.scripts]
dermlat-audit = "dermlat_audit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dermlat_audit = ["prompts/*.txt", "schemas/*.json"]

# -------------------------------------------------------------------
# Tooling
# -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # long-line handled by formatter
    "RUF001", "RUF002", "RUF003",  # we intentionally use Greek letters (κ, α) in reports
    "UP042",  # str+Enum is fine on py311; StrEnum requires py311+ but existing code is clearer
]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src"]
# Third-party stubs (numpy, pandas, scipy, streamlit) drift with the installed versions
# and produce noise unrelated to our code. mypy is used here as a sanity check on our
# own annotations, not as a strict gate on external stub churn.
follow_imports = "silent"
disable_error_code = ["import-untyped", "no-redef", "assignment", "attr-defined"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: slower tests (dedup on many images, resume, full smoke)",
    "requires_mlx: requires mlx-vlm installed and a downloaded model",
    "requires_ollama: requires a running ollama daemon",
]
